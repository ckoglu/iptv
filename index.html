<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Film, dizi, belgesel ve canlı TV.">
<title>IPTV</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="hdr">
  <a class="logo focusable" href="#/">IPTV</a>
  <nav id="nav"></nav>
</header>

<main id="view"></main>

<section id="player" class="player" hidden>
  <video id="video" playsinline webkit-playsinline></video>
  <div class="p-top">
    <button class="p-btn focusable" id="pBack" aria-label="Geri">&#8592;</button>
    <span id="pTitle"></span>
    <span class="live-badge" id="pLive" hidden>CANLI</span>
  </div>
  <div class="p-center"><div class="spin" id="pSpin"></div></div>
  <div class="p-bottom">
    <div class="bar" id="pBar"><div class="fill" id="pFill"></div></div>
    <div class="p-row">
      <button class="p-btn focusable" id="pRw" aria-label="10 saniye geri">&#8630;</button>
      <button class="p-btn big focusable" id="pPlay" aria-label="Oynat">&#9654;</button>
      <button class="p-btn focusable" id="pFf" aria-label="10 saniye ileri">&#8631;</button>
      <span class="p-time"><b id="pCur">0:00</b> / <b id="pDur">0:00</b></span>
      <button class="p-btn focusable" id="pFull" aria-label="Tam ekran">&#9974;</button>
    </div>
  </div>
  <div class="p-error" id="pError" hidden>
    <p id="pErrorText">Yayın açılamadı.</p>
    <button class="btn focusable" id="pRetry">Tekrar dene</button>
    <button class="btn focusable" id="pExit">Geri dön</button>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
